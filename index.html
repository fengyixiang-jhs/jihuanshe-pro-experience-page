<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>集换社 Pro 共创反馈</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10100e;
      --panel: #1d1a16;
      --panel-2: #262119;
      --gold: #edc15c;
      --text: #fff8ea;
      --muted: #cfc2ad;
      --soft: #948774;
      --line: rgba(237, 193, 92, .24);
      --error: #ff8e76;
      --ok: #84d7a3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--bg);
      letter-spacing: 0;
    }

    body {
      display: flex;
      justify-content: center;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 80% -40px, rgba(237, 193, 92, .18), transparent 210px),
        linear-gradient(180deg, #171410 0%, #10100e 100%);
    }

    .top {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 900;
    }

    .brand::before {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: linear-gradient(135deg, #f2ca69, #a36a25);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.18;
      font-weight: 950;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .benefits {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 16px;
    }

    .benefit {
      appearance: none;
      text-align: left;
      min-height: 72px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      background: rgba(255, 255, 255, .055);
      cursor: pointer;
    }

    .benefit strong {
      display: block;
      color: var(--gold);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 950;
    }

    .benefit span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .panel {
      margin-top: 18px;
      padding: 15px;
      border: 1px solid rgba(237, 193, 92, .18);
      border-radius: 14px;
      background: rgba(255, 255, 255, .06);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .24);
    }

    .panel-title {
      margin: 0 0 13px;
      font-size: 19px;
      line-height: 1.35;
      font-weight: 950;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 13px;
    }

    .segmented label {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(0, 0, 0, .18);
      font-size: 14px;
      font-weight: 900;
    }

    .segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented label:has(input:checked) {
      color: #1b1205;
      border-color: transparent;
      background: var(--gold);
    }

    .field {
      margin-top: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 850;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 10px;
      outline: 0;
      color: var(--text);
      background: rgba(0, 0, 0, .22);
      font-size: 14px;
    }

    .field input {
      min-height: 46px;
      padding: 0 12px;
    }

    .field textarea {
      min-height: 126px;
      padding: 12px;
      resize: vertical;
      line-height: 1.6;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(237, 193, 92, .7);
      box-shadow: 0 0 0 3px rgba(237, 193, 92, .12);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(207, 194, 173, .58);
    }

    .upload {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(237, 193, 92, .30);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(237, 193, 92, .055);
      font-size: 13px;
      font-weight: 800;
    }

    .error {
      display: none;
      margin: 7px 0 0;
      color: var(--error);
      font-size: 12px;
    }

    .field.invalid .error {
      display: block;
    }

    .submit {
      width: 100%;
      min-height: 50px;
      margin-top: 15px;
      border-radius: 12px;
      color: #1b1205;
      background: var(--gold);
      font-size: 16px;
      font-weight: 950;
    }

    .rules {
      margin-top: 12px;
      padding: 11px 12px;
      color: var(--soft);
      border: 1px dashed rgba(237, 193, 92, .24);
      border-radius: 12px;
      background: rgba(0, 0, 0, .15);
      font-size: 12px;
      line-height: 1.65;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(360px, calc(100% - 32px));
      padding: 13px 14px;
      transform: translate(-50%, 120%);
      opacity: 0;
      border: 1px solid rgba(132, 215, 163, .28);
      border-radius: 12px;
      color: var(--text);
      background: rgba(18, 22, 19, .96);
      box-shadow: 0 16px 38px rgba(0, 0, 0, .38);
      transition: transform .22s ease, opacity .22s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast strong {
      display: block;
      color: var(--ok);
      font-size: 14px;
      line-height: 1.4;
    }

    .toast span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, .58);
    }

    .modal.show {
      display: flex;
    }

    .modal-panel {
      width: min(398px, 100%);
      padding: 16px;
      border: 1px solid rgba(237, 193, 92, .24);
      border-radius: 18px;
      background: #1b1814;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .46);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .modal-title {
      margin: 0;
      color: var(--gold);
      font-size: 18px;
      line-height: 1.35;
      font-weight: 950;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--muted);
      background: rgba(255, 255, 255, .08);
      font-size: 22px;
      line-height: 1;
    }

    .modal-copy {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .modal-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .055);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .modal-row strong {
      color: var(--text);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <span class="brand">集换社 Pro</span>
    </div>

    <header>
      <h1>提 Bug，赢大奖</h1>
      <p class="subtitle">集换社 Pro 全新上线！熟悉的市场，更高端的服务。即日起提交 Bug 和建议，我们会根据质量和有效留言数量为各位贡献者提供原盒奖励，并为所有提供有效建议的玩家在 APP 荣誉墙署名！填写表格、提交 Bug 和建议，一起打造更和谐的 TCG 社区和市场！</p>
      <div class="benefits">
        <button class="benefit" type="button" data-modal="reward">
          <strong>提交有奖</strong>
          <span>确认采纳并发奖后，名单会在这里更新。</span>
        </button>
        <button class="benefit" type="button" data-modal="rank">
          <strong>共创荣誉榜</strong>
          <span>按有效建议数量排名，贡献越多越靠前。</span>
        </button>
      </div>
    </header>

    <section class="panel">
      <h2 class="panel-title">提交反馈</h2>
      <form id="feedbackForm" novalidate>
        <div class="segmented" role="radiogroup" aria-label="反馈类型">
          <label><input type="radio" name="type" value="Bug" checked />Bug</label>
          <label><input type="radio" name="type" value="建议" />建议</label>
        </div>

        <div class="field" data-field="location">
          <label for="location">发生位置</label>
          <input id="location" name="location" type="text" placeholder="例如：搜索、行情、订单" />
          <p class="error">请填写发生位置。</p>
        </div>

        <div class="field" data-field="content">
          <label for="content">问题或建议</label>
          <textarea id="content" name="content" placeholder="简单说明你遇到的问题，或希望怎么优化"></textarea>
          <p class="error">请填写反馈内容。</p>
        </div>

        <div class="field">
          <label>截图</label>
          <div class="upload">+ 添加截图（可选）</div>
        </div>

        <button class="submit" type="submit">提交反馈</button>
      </form>
    </section>

    <div class="rules">
      说明：奖励和榜单会结合反馈质量、影响范围、是否采纳综合确认，最终以官方通知为准。
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <strong>提交成功，感谢你来共创</strong>
    <span>我们会认真查看，符合条件的反馈会参与原盒奖励和荣誉榜统计。</span>
  </div>

  <div class="modal" id="infoModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <p class="modal-copy" id="modalCopy"></p>
      <div class="modal-list" id="modalList"></div>
    </div>
  </div>

  <script>
    const config = {
      submitApi: ""
    };

    const modalContent = {
      reward: {
        title: "确认采纳名单",
        copy: "已确认采纳并完成发奖的反馈，会在这里更新展示。",
        rows: [
          ["暂无名单", "发奖后更新"]
        ]
      },
      rank: {
        title: "有效建议数量排名",
        copy: "按玩家提交的有效 Bug 和建议数量排序，后续同步 APP 荣誉墙。",
        rows: [
          ["暂无排名", "统计后更新"]
        ]
      }
    };

    const form = document.querySelector("#feedbackForm");
    const toast = document.querySelector("#toast");
    const requiredFields = ["location", "content"];
    const modal = document.querySelector("#infoModal");
    const modalTitle = document.querySelector("#modalTitle");
    const modalCopy = document.querySelector("#modalCopy");
    const modalList = document.querySelector("#modalList");
    const closeModalButton = document.querySelector(".modal-close");

    function validate() {
      let valid = true;
      requiredFields.forEach((name) => {
        const input = form.elements[name];
        const field = document.querySelector(`[data-field="${name}"]`);
        const ok = Boolean(input.value.trim());
        field.classList.toggle("invalid", !ok);
        if (!ok) valid = false;
      });
      return valid;
    }

    function showToast() {
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 3600);
    }

    async function submitFeedback(payload) {
      console.log("集换社 Pro 共创反馈：", payload);
      if (!config.submitApi) return { ok: true };
      const res = await fetch(config.submitApi, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return { ok: res.ok };
    }

    form.addEventListener("input", (event) => {
      if (requiredFields.includes(event.target.name)) {
        document.querySelector(`[data-field="${event.target.name}"]`).classList.remove("invalid");
      }
    });

    document.querySelectorAll("[data-modal]").forEach((button) => {
      button.addEventListener("click", () => {
        const content = modalContent[button.dataset.modal];
        modalTitle.textContent = content.title;
        modalCopy.textContent = content.copy;
        modalList.innerHTML = content.rows.map(([name, status]) => `
          <div class="modal-row"><strong>${name}</strong><span>${status}</span></div>
        `).join("");
        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
      });
    });

    function closeModal() {
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
    }

    closeModalButton.addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validate()) return;

      const payload = Object.fromEntries(new FormData(form).entries());
      payload.submittedAt = new Date().toISOString();

      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = "提交中...";

      try {
        const result = await submitFeedback(payload);
        if (!result.ok) throw new Error("submit failed");
        form.reset();
        showToast();
      } catch (error) {
        alert("提交失败，请稍后再试");
      } finally {
        button.disabled = false;
        button.textContent = "提交反馈";
      }
    });
  </script>
</body>
</html>
