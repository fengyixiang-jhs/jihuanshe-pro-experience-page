<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>集换社 Pro 共创反馈</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10100e;
      --panel: #1d1a16;
      --panel-2: #262119;
      --gold: #edc15c;
      --text: #fff8ea;
      --muted: #cfc2ad;
      --soft: #948774;
      --line: rgba(237, 193, 92, .24);
      --error: #ff8e76;
      --ok: #84d7a3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--bg);
      letter-spacing: 0;
    }

    body {
      display: flex;
      justify-content: center;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 80% -40px, rgba(237, 193, 92, .18), transparent 210px),
        linear-gradient(180deg, #171410 0%, #10100e 100%);
    }

    .top {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 900;
    }

    .brand::before {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: linear-gradient(135deg, #f2ca69, #a36a25);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.18;
      font-weight: 950;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .benefits {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 16px;
    }

    .benefit {
      min-height: 72px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      background: rgba(255, 255, 255, .055);
    }

    .benefit strong {
      display: block;
      color: var(--gold);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 950;
    }

    .benefit span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .panel {
      margin-top: 18px;
      padding: 15px;
      border: 1px solid rgba(237, 193, 92, .18);
      border-radius: 14px;
      background: rgba(255, 255, 255, .06);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .24);
    }

    .panel-title {
      margin: 0 0 13px;
      font-size: 19px;
      line-height: 1.35;
      font-weight: 950;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 13px;
    }

    .segmented label {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(0, 0, 0, .18);
      font-size: 14px;
      font-weight: 900;
    }

    .segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented label:has(input:checked) {
      color: #1b1205;
      border-color: transparent;
      background: var(--gold);
    }

    .field {
      margin-top: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 850;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 10px;
      outline: 0;
      color: var(--text);
      background: rgba(0, 0, 0, .22);
      font-size: 14px;
    }

    .field input {
      min-height: 46px;
      padding: 0 12px;
    }

    .field textarea {
      min-height: 126px;
      padding: 12px;
      resize: vertical;
      line-height: 1.6;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(237, 193, 92, .7);
      box-shadow: 0 0 0 3px rgba(237, 193, 92, .12);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(207, 194, 173, .58);
    }

    .upload {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(237, 193, 92, .30);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(237, 193, 92, .055);
      font-size: 13px;
      font-weight: 800;
    }

    .error {
      display: none;
      margin: 7px 0 0;
      color: var(--error);
      font-size: 12px;
    }

    .field.invalid .error {
      display: block;
    }

    .submit {
      width: 100%;
      min-height: 50px;
      margin-top: 15px;
      border-radius: 12px;
      color: #1b1205;
      background: var(--gold);
      font-size: 16px;
      font-weight: 950;
    }

    .rules {
      margin-top: 12px;
      padding: 11px 12px;
      color: var(--soft);
      border: 1px dashed rgba(237, 193, 92, .24);
      border-radius: 12px;
      background: rgba(0, 0, 0, .15);
      font-size: 12px;
      line-height: 1.65;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(360px, calc(100% - 32px));
      padding: 13px 14px;
      transform: translate(-50%, 120%);
      opacity: 0;
      border: 1px solid rgba(132, 215, 163, .28);
      border-radius: 12px;
      color: var(--text);
      background: rgba(18, 22, 19, .96);
      box-shadow: 0 16px 38px rgba(0, 0, 0, .38);
      transition: transform .22s ease, opacity .22s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast strong {
      display: block;
      color: var(--ok);
      font-size: 14px;
      line-height: 1.4;
    }

    .toast span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <span class="brand">集换社 Pro</span>
    </div>

    <header>
      <h1>Pro 共创反馈</h1>
      <p class="subtitle">用 Pro 时哪里卡、哪里不顺，欢迎告诉我们。好的反馈有机会拿原盒，也会记入共创贡献。</p>
      <div class="benefits">
        <div class="benefit">
          <strong>提交有奖</strong>
          <span>Bug 定位清楚、建议有价值，就有机会拿原盒。</span>
        </div>
        <div class="benefit">
          <strong>共创荣誉榜</strong>
          <span>持续贡献的玩家，会被记录在 App 内荣誉榜。</span>
        </div>
      </div>
    </header>

    <section class="panel">
      <h2 class="panel-title">提交反馈</h2>
      <form id="feedbackForm" novalidate>
        <div class="segmented" role="radiogroup" aria-label="反馈类型">
          <label><input type="radio" name="type" value="Bug" checked />Bug</label>
          <label><input type="radio" name="type" value="建议" />建议</label>
        </div>

        <div class="field" data-field="location">
          <label for="location">发生位置</label>
          <input id="location" name="location" type="text" placeholder="例如：搜索、行情、订单" />
          <p class="error">请填写发生位置。</p>
        </div>

        <div class="field" data-field="content">
          <label for="content">问题或建议</label>
          <textarea id="content" name="content" placeholder="简单说明你遇到的问题，或希望怎么优化"></textarea>
          <p class="error">请填写反馈内容。</p>
        </div>

        <div class="field">
          <label>截图</label>
          <div class="upload">+ 添加截图（可选）</div>
        </div>

        <button class="submit" type="submit">提交反馈</button>
      </form>
    </section>

    <div class="rules">
      说明：奖励和榜单会结合反馈质量、影响范围、是否采纳综合确认，最终以官方通知为准。
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <strong>提交成功，感谢你来共创</strong>
    <span>我们会认真查看，符合条件的反馈会参与原盒奖励和荣誉榜统计。</span>
  </div>

  <script>
    const config = {
      submitApi: ""
    };

    const form = document.querySelector("#feedbackForm");
    const toast = document.querySelector("#toast");
    const requiredFields = ["location", "content"];

    function validate() {
      let valid = true;
      requiredFields.forEach((name) => {
        const input = form.elements[name];
        const field = document.querySelector(`[data-field="${name}"]`);
        const ok = Boolean(input.value.trim());
        field.classList.toggle("invalid", !ok);
        if (!ok) valid = false;
      });
      return valid;
    }

    function showToast() {
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 3600);
    }

    async function submitFeedback(payload) {
      console.log("集换社 Pro 共创反馈：", payload);
      if (!config.submitApi) return { ok: true };
      const res = await fetch(config.submitApi, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return { ok: res.ok };
    }

    form.addEventListener("input", (event) => {
      if (requiredFields.includes(event.target.name)) {
        document.querySelector(`[data-field="${event.target.name}"]`).classList.remove("invalid");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validate()) return;

      const payload = Object.fromEntries(new FormData(form).entries());
      payload.submittedAt = new Date().toISOString();

      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = "提交中...";

      try {
        const result = await submitFeedback(payload);
        if (!result.ok) throw new Error("submit failed");
        form.reset();
        showToast();
      } catch (error) {
        alert("提交失败，请稍后再试");
      } finally {
        button.disabled = false;
        button.textContent = "提交反馈";
      }
    });
  </script>
</body>
</html>
